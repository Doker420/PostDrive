[project]
name = "flowpay-api"
version = "0.1.0"
description = "FlowPay payment orchestration API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "pyotp>=2.9,<3",
  "aiogram>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["apps*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
